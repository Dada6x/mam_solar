name: mam_solar
description: "mam-solarbau Field Protocol App - Offline-first protocol forms and PDF export"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  modal_bottom_sheet: ^3.0.0
  sized_context: ^1.0.0+4
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.4
  flutter_secure_storage: ^10.0.0
  go_router: ^17.2.0
  image_picker: ^1.0.7
  permission_handler: ^12.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  vibration: ^3.1.8
  path_provider: ^2.1.5
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  file_picker: ^11.0.2
  open_filex: ^4.7.0
  pdf: ^3.10.8
  printing: ^5.13.1
  syncfusion_flutter_signaturepad: ^27.1.48
  flutter_native_splash: ^2.4.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  device_preview: ^1.3.1
  logger: ^2.7.0
  json_serializable: ^6.13.1
  build_runner: ^2.13.1
  freezed: ^3.2.5
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/protocols/
    - assets/
    - shorebird.yaml

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/static/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/static/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/static/Cairo-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

  # For Android adaptive icon (API 26+)
  adaptive_icon_background: "#FFFFFF"  # or an image path
  adaptive_icon_foreground: "assets/logo.png"


flutter_native_splash:
  color: "#ffffff"

  image: assets/logo.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#ffffff"
    image: assets/logo.png