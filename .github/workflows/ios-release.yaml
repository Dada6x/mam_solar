name: Flutter iOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # -----------------------
      # Checkout repo (important for tags)
      # -----------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------
      # Setup Flutter (FIXED)
      # -----------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # -----------------------
      # Install dependencies
      # -----------------------
      - name: Install dependencies
        run: flutter pub get

      # -----------------------
      # Build iOS IPA (unsigned)
      # -----------------------
      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      # -----------------------
      # Package build output
      # -----------------------
      - name: Package XCArchive
        run: |
          cd build/ios/archive
          zip -r ../../../MyApp-${{ github.ref_name }}.zip Runner.xcarchive

      # -----------------------
      # Create GitHub Release
      # -----------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: MyApp-${{ github.ref_name }}.zip
          body: |
            ## 📱 iOS Build

            ### Install steps:
            1. Download the `.zip`
            2. Extract it
            3. Use Sideloadly to install the `.xcarchive`
            4. Trust developer in iOS settings