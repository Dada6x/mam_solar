name: Flutter iOS Release

on:
  push:
    tags:
      - 'v*' # triggers on tags like v1.0.0, v1.2.3

permissions:
  contents: write   # 👈 REQUIRED for creating releases

jobs:
  build-ios:
    runs-on: macos-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '' # match your flutter version
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned .ipa
        run: flutter build ipa --release --no-codesign

      # Rename for clarity
      - name: Package xcarchive
        run: |
          cd build/ios/archive
          zip -r ../../../MyApp-${{ github.ref_name }}.zip Runner.xcarchive

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MyApp-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## Install instructions
            1. Download the `.zip` file below
            2. Extract it
            3. Install [Sideloadly](https://sideloadly.io/) 
            4. Drag the `.xcarchive` into Sideloadly and hit Start
            5. Trust the app: Settings → General → VPN & Device Management
