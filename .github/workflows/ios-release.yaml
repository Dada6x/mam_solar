name: Flutter iOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # REQUIRED for GitHub Release

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # important for tags/releases

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'   # or pin a real version like '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned .ipa
        run: flutter build ipa --release --no-codesign

      - name: Package xcarchive
        run: |
          cd build/ios/archive
          zip -r ../../../MyApp-${{ github.ref_name }}.zip Runner.xcarchive

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MyApp-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## Install instructions
            1. Download the `.zip`
            2. Extract it
            3. Use Sideloadly to install
            4. Trust the developer in iOS settings