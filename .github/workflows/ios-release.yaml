name: Flutter iOS Release (IPA)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # --------------------
      # Checkout
      # --------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------
      # Flutter setup
      # --------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------
      # Dependencies
      # --------------------
      - name: Install dependencies
        run: flutter pub get

      # --------------------
      # Build IPA (IMPORTANT)
      # --------------------
      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      # --------------------
      # Find and rename IPA
      # --------------------
      - name: Locate IPA
        run: |
          find build/ios/ipa -name "*.ipa"
          cp build/ios/ipa/*.ipa MyApp-${{ github.ref_name }}.ipa

      # --------------------
      # Create GitHub Release
      # --------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: MyApp-${{ github.ref_name }}.ipa
          body: |
            ## 📱 iOS IPA Build

            ### Install:
            - Use Sideloadly or AltStore
            - Drag & install the `.ipa`
            - Trust developer in iOS settings