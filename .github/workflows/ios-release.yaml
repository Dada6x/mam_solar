name: Flutter iOS Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ''
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned archive
        run: flutter build ipa --release --no-codesign

      - name: Package xcarchive
        run: |
          cd build/ios/archive
          zip -r ../../../MyApp-${{ github.ref_name }}.zip Runner.xcarchive

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MyApp-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## Install instructions
            1. Download the `.zip` file below
            2. Extract it
            3. Open Sideloadly on your PC
            4. Plug in iPhone
            5. Drag the `.xcarchive` into Sideloadly → Start
            6. Trust: Settings → General → VPN & Device Management
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}